name = "password-checker"
compatibility_date = "2026-01-01"
pages_build_output_dir = "."

# Cloudflare Pages Functions live in /functions.
# /functions/api/stats.js serves the visit counter (today / this week / all time)
# and needs a KV namespace bound as `VISITS`:
#   1. npx wrangler kv namespace create VISITS
#   2. add the printed id under [[kv_namespaces]] below
#   3. Settings -> Functions -> Bindings -> add KV namespace, variable name VISITS
# Without the binding the endpoint returns source:"none" and the site falls back
# to a per-device counter stored in localStorage, so the page still works.
#
# [[kv_namespaces]]
# binding = "VISITS"
# id = "<your-kv-namespace-id>"

[vars]
SITE_NAME = "PassMeter"
