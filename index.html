<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Good Is My Password?</title>
<style>
  :root {
    --bg1:#f5f7fa; --bg2:#e8ecf3; --card:rgba(255,255,255,.72);
    --text:#1f2937; --muted:#6b7280; --blue:#2563eb; --darkblue:#1e3a8a;
    --accent:#3b82f6; --border:rgba(255,255,255,.6);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
    color:var(--text); padding:24px; overflow:hidden;
  }
  .orb { position:fixed; border-radius:50%; filter:blur(60px); opacity:.35; pointer-events:none; animation:float 12s ease-in-out infinite; }
  .orb.a { width:320px; height:320px; background:#dbeafe; top:-80px; left:-80px; }
  .orb.b { width:280px; height:280px; background:#e0e7ff; bottom:-60px; right:-60px; animation-delay:-6s; }
  @keyframes float { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }
  .card {
    position:relative; width:100%; max-width:620px;
    background:var(--card); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--border); border-radius:24px; padding:48px 36px;
    box-shadow:0 30px 80px rgba(30,58,138,.12), 0 2px 6px rgba(0,0,0,.04);
    animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise { from{opacity:0; transform:translateY(24px)} to{opacity:1; transform:translateY(0)} }
  h1 { margin:0 0 6px; font-size:2rem; font-weight:700; letter-spacing:-.02em; }
  p.sub { margin:0 0 32px; color:var(--muted); font-size:1rem; }
  .input-wrap { position:relative; }
  input {
    width:100%; padding:16px 52px 16px 18px; font-size:1.1rem;
    border-radius:14px; border:1px solid #d1d5db; background:rgba(255,255,255,.9);
    color:var(--text); outline:none; transition:border-color .25s, box-shadow .25s, transform .25s;
  }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(59,130,246,.15); transform:translateY(-1px); }
  .toggle { position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.2rem; transition:color .2s, transform .2s; }
  .toggle:hover { color:var(--blue); transform:translateY(-50%) scale(1.1); }
  .bar { margin-top:22px; height:10px; border-radius:6px; background:rgba(30,58,138,.08); overflow:hidden; }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--darkblue)); border-radius:6px; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .result { margin-top:30px; font-size:1.3rem; line-height:1.7; text-align:center; min-height:72px; opacity:0; animation:fadeIn .6s .2s forwards; }
  @keyframes fadeIn { to{opacity:1} }
  .blue { color:var(--blue); font-weight:700; }
  .darkblue { color:var(--darkblue); font-weight:700; }
  .hint { margin-top:14px; font-size:.85rem; color:var(--muted); text-align:center; letter-spacing:.02em; }
</style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="card">
    <h1>How good is my password?</h1>
    <p class="sub">Type a password to see how long it would take to crack.</p>
    <div class="input-wrap">
      <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="Enter a password">
      <button class="toggle" id="tog" aria-label="Toggle visibility">👁</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="result" id="result">Enter a password to begin.</div>
    <div class="hint" id="hint"></div>
  </div>
<script>
const SPEED_1990 = 1e3;
const SPEED_TODAY = 1e10;

function compact(n){
  if (n < 1000) return n.toFixed(n<10?2:n<100?1:0);
  const units = [["K",1e3],["M",1e6],["B",1e9],["T",1e12],["Q",1e15]];
  let u = units[0];
  for (const x of units){ if (n >= x[1]) u=x; else break; }
  return (n/u[1]).toFixed(n/u[1]>=100?0:n/u[1]>=10?1:2)+u[0];
}
function charsetSize(pw){
  let s=0;
  if (/[a-z]/.test(pw)) s+=26;
  if (/[A-Z]/.test(pw)) s+=26;
  if (/[0-9]/.test(pw)) s+=10;
  if (/[^a-zA-Z0-9]/.test(pw)) s+=32;
  if (s===0) s=1;
  return s;
}
function formatTime(sec){
  if (!isFinite(sec) || sec < 0) return "forever";
  if (sec < 1) return "instantly";
  const units = [["second",1],["minute",60],["hour",3600],["day",86400],["year",31557600],["century",3155760000]];
  let best=0;
  for (let i=0;i<units.length;i++){ if (sec/units[i][1] >=1) best=i; }
  const val=sec/units[best][1];
  const name=units[best][0];
  if (val>=1e15) return "centuries";
  const num = compact(val);
  const plural = (num.replace(/[KMBTQ]/g,"") != "1" && name!=="centuries") ? "s" : "";
  return num+" "+name+plural;
}
function crackTime(pw, speed){
  const cs = charsetSize(pw);
  const guesses = Math.pow(cs, pw.length);
  return (guesses/2)/speed;
}
const pw=document.getElementById('pw');
const result=document.getElementById('result');
const hint=document.getElementById('hint');
const bar=document.getElementById('bar');
const tog=document.getElementById('tog');
tog.addEventListener('click',()=>{ pw.type = pw.type==='password'?'text':'password'; });
pw.addEventListener('input',()=>{
  const v=pw.value;
  if (!v){ result.textContent='Enter a password to begin.'; hint.textContent=''; bar.style.width='0%'; return; }
  const t90=crackTime(v,SPEED_1990);
  const tnow=crackTime(v,SPEED_TODAY);
  result.innerHTML = `In 1990, your password would have taken <span class="blue">${formatTime(t90)}</span> to decode with a machine. Today, it would only take <span class="darkblue">${formatTime(tnow)}</span>`;
  const cs=charsetSize(v);
  const entropy = Math.log2(Math.pow(cs,v.length));
  const pct = Math.min(100, Math.max(2, entropy/128*100));
  bar.style.width = pct+'%';
  hint.textContent = `Length ${v.length} · charset ${cs} · ~${compact(entropy)} bits of entropy`;
});
</script>
</body>
</html>
