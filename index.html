<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How Good Is My Password?</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --blue:#3b82f6; --darkblue:#1e3a8a; --accent:#60a5fa; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at top,#1e293b,#0f172a); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--text); padding:24px; }
  .card { width:100%; max-width:640px; background:var(--card); border:1px solid #334155; border-radius:16px; padding:40px 32px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  h1 { margin:0 0 8px; font-size:1.8rem; }
  p.sub { margin:0 0 28px; color:var(--muted); }
  .input-wrap { position:relative; }
  input[type=password], input[type=text] { width:100%; padding:14px 48px 14px 16px; font-size:1.1rem; border-radius:10px; border:1px solid #475569; background:#0f172a; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  .toggle { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:1.1rem; }
  .result { margin-top:28px; font-size:1.25rem; line-height:1.6; text-align:center; min-height:60px; }
  .blue { color:var(--blue); font-weight:700; }
  .darkblue { color:var(--darkblue); font-weight:700; }
  .hint { margin-top:12px; font-size:.85rem; color:var(--muted); text-align:center; }
  .bar { margin-top:20px; height:8px; border-radius:4px; background:#0f172a; overflow:hidden; }
  .bar > div { height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--darkblue)); transition:width .3s; }
</style>
</head>
<body>
  <div class="card">
    <h1>How good is my password?</h1>
    <p class="sub">Type a password to see how long it would take to crack.</p>
    <div class="input-wrap">
      <input id="pw" type="password" autocomplete="off" spellcheck="false" placeholder="Enter a password">
      <button class="toggle" id="tog" aria-label="Toggle visibility">👁</button>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="result" id="result">Enter a password to begin.</div>
    <div class="hint" id="hint"></div>
  </div>
<script>
const SPEED_1990 = 1e3;     // guesses/sec on a 1990 machine
const SPEED_TODAY = 1e10;   // guesses/sec today (GPU cluster)

function charsetSize(pw){
  let s=0;
  if (/[a-z]/.test(pw)) s+=26;
  if (/[A-Z]/.test(pw)) s+=26;
  if (/[0-9]/.test(pw)) s+=10;
  if (/[^a-zA-Z0-9]/.test(pw)) s+=32;
  if (s===0) s=1;
  return s;
}
function formatTime(sec){
  if (!isFinite(sec) || sec < 0) return "forever";
  if (sec < 1) return "instantly";
  const units = [["second",1],["minute",60],["hour",3600],["day",86400],["year",31557600],["century",3155760000]];
  let val=sec, name="second";
  for (let i=0;i<units.length;i++){
    if (sec >= units[i][1]) { val=sec/units[i][1]; name=units[i][0]; }
    else break;
  }
  // pick largest unit where value >=1
  let best=0;
  for (let i=0;i<units.length;i++){
    if (sec/units[i][1] >=1) best=i;
  }
  val=sec/units[best][1]; name=units[best][0];
  if (val>=1e15) return "centuries";
  const n = val>=100 ? Math.round(val) : (val>=10?val.toFixed(1):val.toFixed(2));
  return n+" "+name+(n!=1&&name!=="centuries"?"s":"");
}
function crackTime(pw, speed){
  const cs = charsetSize(pw);
  const guesses = Math.pow(cs, pw.length);
  return (guesses/2)/speed; // average case
}
const pw=document.getElementById('pw');
const result=document.getElementById('result');
const hint=document.getElementById('hint');
const bar=document.getElementById('bar');
const tog=document.getElementById('tog');
tog.addEventListener('click',()=>{ pw.type = pw.type==='password'?'text':'password'; });
pw.addEventListener('input',()=>{
  const v=pw.value;
  if (!v){ result.textContent='Enter a password to begin.'; hint.textContent=''; bar.style.width='0%'; return; }
  const t90=crackTime(v,SPEED_1990);
  const tnow=crackTime(v,SPEED_TODAY);
  result.innerHTML = `In 1990, your password would have taken <span class="blue">${formatTime(t90)}</span> to decode with a machine. Today, it would only take <span class="darkblue">${formatTime(tnow)}</span>`;
  const cs=charsetSize(v);
  const entropy = Math.log2(Math.pow(cs,v.length));
  const pct = Math.min(100, Math.max(2, entropy/128*100));
  bar.style.width = pct+'%';
  hint.textContent = `Length ${v.length} · charset ${cs} · ~${entropy.toFixed(0)} bits of entropy`;
});
</script>
</body>
</html>
